{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-5 bg-white">
  <div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card shadow border-0">
        <div class="card-body">
          <h4 class="card-title">Update Single Group</h4>
          <p class="card-description">Update description or members for a group.</p>

          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label>Group Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="group_name" required>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea class="form-control" name="description" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label>Add Members (comma-separated usernames/computers)</label>
              <input type="text" class="form-control" name="add_members">
            </div>
            <div class="form-group">
              <label>Remove Members (comma-separated usernames/computers)</label>
              <input type="text" class="form-control" name="remove_members">
            </div>
            <button type="submit" class="btn btn-warning">Update Group</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
