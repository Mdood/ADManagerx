{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-5 bg-white d-flex p-2">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white d-flex align-items-center">
          <i class="mdi mdi-account-group mr-2" style="font-size: 1.5rem;"></i>
          <h4 class="mb-0 ml-2">Create New Group</h4>
        </div>
        <div class="card-body p-4">
          <form method="post" autocomplete="off">
            {% csrf_token %}
            <div class="row">
              <!-- Group Name -->
              <div class="col-md-12 mb-3">
                <label class="form-label font-weight-bold">Group Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="group_name" placeholder="Enter group name" required>
              </div>

              <!-- Description -->
              <div class="col-md-12 mb-3">
                <label class="form-label font-weight-bold">Description</label>
                <textarea class="form-control" name="description" rows="2" placeholder="Short description or notes"></textarea>
              </div>

              <!-- Assign Users -->
              <div class="col-md-12 mb-3">
                <label class="form-label font-weight-bold">Assign Users</label>
                <input type="text" class="form-control" name="users" placeholder="Comma-separated usernames">
              </div>

              <!-- Assign Computers -->
              <div class="col-md-12 mb-3">
                <label class="form-label font-weight-bold">Assign Computers</label>
                <input type="text" class="form-control" name="computers" placeholder="Comma-separated computer names">
              </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
              <button type="submit" class="btn btn-primary px-4 mr-2">
                <i class="mdi mdi-account-group-outline mr-1"></i> Create Group
              </button>
              <a href="{% url 'group_management' %}" class="btn btn-light px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
