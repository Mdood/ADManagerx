{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Unlock Single User</h4>
          <p class="card-description">Provide the username to unlock the user account.</p>

          <form method="POST" action="{% url 'unlock_single_user' %}">
            {% csrf_token %}

            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Enter the username" required>
            </div>

            <button type="submit" class="btn btn-success mt-3">Unlock User</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
