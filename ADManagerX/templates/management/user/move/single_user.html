{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Move Single User</h4>
          <p class="card-description">Move a user to a different Organizational Unit (OU)</p>
          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Enter username">
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label font-weight-bold">Target OU <span class="text-danger">*</span></label>

                {% if ous %}
                  <select name="target_ou_dn" class="form-control" required>
                    <option value="" disabled {% if not request.POST.target_ou_dn %}selected{% endif %}>-- Select OU --</option>
                    {% for ou in ous %}
                      <option value="{{ ou.dn }}" {% if request.POST.target_ou_dn == ou.dn %}selected{% endif %}>
                        {{ ou.ou }} — {{ ou.dn }}
                      </option>
                    {% endfor %}
                  </select>
                {% else %}
                  <div class="alert alert-warning mb-0">
                    No OUs found (or LDAP not reachable). Check LDAP settings and permissions.
                  </div>
                {% endif %}
              </div>

            <button type="submit" class="btn btn-secondary">Move User</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
