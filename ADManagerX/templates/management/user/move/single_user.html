{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-5 bg-white">
  {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} mb-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
  <div class="row">
    <div class="col-md-6 offset-md-3 grid-margin stretch-card">
      <div class="card shadow border-0">
        <div class="card-body">
          <h4 class="card-title">Move Single User</h4>
          <p class="card-description">Move a user to a different Organizational Unit (OU)</p>
          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Enter username">
            </div>
            <div class="form-group">
              <label for="target_ou">Target OU</label>
              <input type="text" class="form-control" id="target_ou" name="target_ou" placeholder="Enter target OU path">
            </div>
            <button type="submit" class="btn btn-primary">Move User</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
