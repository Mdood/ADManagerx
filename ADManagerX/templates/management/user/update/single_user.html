{% extends 'layout.html' %}
{% load static %}



{% block extra_head %}
<style>
  .management-page {
    background: #f4f8ff !important;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .management-page .page-heading,
  .management-page > h4,
  .management-page .card-title {
    color: #172554;
    font-weight: 800;
  }

  .management-page > h4 {
    font-size: 28px;
    margin-bottom: 6px !important;
  }

  .management-page > p.text-muted {
    color: #64748b !important;
    margin-bottom: 24px;
  }

  .management-page .card,
  .management-page .adx-card {
    border: 1px solid rgba(37, 99, 235, 0.10) !important;
    border-radius: 18px !important;
    box-shadow: 0 12px 32px rgba(30, 64, 175, 0.10) !important;
    overflow: hidden;
  }

  .management-page .card-body {
    padding: 24px;
  }

  .management-page .card-header,
  .management-page .adx-card-header {
    background: linear-gradient(135deg, #1e3a8a, #1d4ed8) !important;
    color: #ffffff !important;
    border: 0 !important;
    padding: 18px 24px;
  }

  .management-page .card-header h4,
  .management-page .card-header h5,
  .management-page .card-header i,
  .management-page .adx-card-header h4,
  .management-page .adx-card-header h5,
  .management-page .adx-card-header i {
    color: #ffffff !important;
  }

  .management-page .card-description,
  .management-page .text-muted,
  .management-page small {
    color: #64748b !important;
  }

  .management-page label,
  .management-page .form-label {
    color: #0f172a;
    font-weight: 700;
  }

  .management-page .form-control,
  .management-page select,
  .management-page textarea,
  .management-page input[type="file"] {
    border-radius: 12px !important;
    border: 1px solid #dbeafe !important;
    min-height: 44px;
  }

  .management-page .form-control:focus,
  .management-page select:focus,
  .management-page textarea:focus {
    border-color: #2563eb !important;
    box-shadow: 0 0 0 0.15rem rgba(37, 99, 235, 0.16) !important;
  }

  .management-page .btn {
    border-radius: 12px !important;
    font-weight: 800;
    padding: 9px 16px;
  }

  .management-page .btn-primary,
  .management-page .btn-info,
  .management-page .btn-success,
  .management-page .btn-warning,
  .management-page .btn-dark,
  .management-page .btn-secondary {
    background: #2563eb !important;
    border-color: #2563eb !important;
    color: #ffffff !important;
  }

  .management-page .btn-primary:hover,
  .management-page .btn-info:hover,
  .management-page .btn-success:hover,
  .management-page .btn-warning:hover,
  .management-page .btn-dark:hover,
  .management-page .btn-secondary:hover {
    background: #1d4ed8 !important;
    border-color: #1d4ed8 !important;
    color: #ffffff !important;
  }

  .management-page .btn-outline-primary,
  .management-page .btn-outline-info,
  .management-page .btn-outline-success,
  .management-page .btn-outline-warning,
  .management-page .btn-outline-dark,
  .management-page .btn-outline-secondary,
  .management-page .adx-sample-btn {
    border-color: #2563eb !important;
    color: #1d4ed8 !important;
    background: #ffffff !important;
  }

  .management-page .btn-outline-primary:hover,
  .management-page .btn-outline-info:hover,
  .management-page .btn-outline-success:hover,
  .management-page .btn-outline-warning:hover,
  .management-page .btn-outline-dark:hover,
  .management-page .btn-outline-secondary:hover,
  .management-page .adx-sample-btn:hover {
    background: #eff6ff !important;
    color: #1e40af !important;
  }

  .management-page .border.rounded.bg-light,
  .management-page .bg-light {
    background: #eff6ff !important;
    border-color: #dbeafe !important;
  }

  .management-page .management-action-card {
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    height: 100%;
  }

  .management-page .management-action-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 36px rgba(30, 64, 175, 0.14) !important;
  }

  .management-page .bulk-help-box {
    background: #eff6ff;
    border: 1px dashed #93c5fd;
    border-radius: 14px;
    padding: 12px 14px;
    margin: 12px 0 18px;
    color: #1e3a8a;
    font-weight: 700;
  }
</style>
{% endblock extra_head %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Update Single User</h4>
          <p class="card-description">Update selected attributes for a user.</p>

          <form method="post" autocomplete="off">
            {% csrf_token %}

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">
                  Username <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  name="username"
                  value="{{ request.POST.username|default:'' }}"
                  required
                >
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Display Name</label>
                <input
                  type="text"
                  class="form-control"
                  name="display_name"
                  value="{{ request.POST.display_name|default:'' }}"
                >
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">First Name</label>
                <input
                  type="text"
                  class="form-control"
                  name="first_name"
                  value="{{ request.POST.first_name|default:'' }}"
                >
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Last Name</label>
                <input
                  type="text"
                  class="form-control"
                  name="last_name"
                  value="{{ request.POST.last_name|default:'' }}"
                >
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Email</label>
                <input
                  type="email"
                  class="form-control"
                  name="email"
                  value="{{ request.POST.email|default:'' }}"
                >
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Phone</label>
                <input
                  type="text"
                  class="form-control"
                  name="phone"
                  value="{{ request.POST.phone|default:'' }}"
                >
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Department</label>
                <input
                  type="text"
                  class="form-control"
                  name="department"
                  value="{{ request.POST.department|default:'' }}"
                >
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">HR ID</label>
                <input
                  type="text"
                  class="form-control"
                  name="hr_id"
                  placeholder="Enter HR ID"
                  value="{{ request.POST.hr_id|default:'' }}"
                >
              </div>

              <div class="col-md-12 mb-3">
                <label class="form-label font-weight-bold">Description</label>
                <textarea
                  class="form-control"
                  name="description"
                  rows="2"
                >{{ request.POST.description|default:'' }}</textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-warning">
              Update User
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
