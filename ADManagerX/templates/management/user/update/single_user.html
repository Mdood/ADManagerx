{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-5 bg-white">
  {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} mb-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
  <div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card shadow border-0">
        <div class="card-body">
          <h4 class="card-title">Update Single User</h4>
          <p class="card-description">Update selected attributes for a user.</p>

          <form method="post">
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Username <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="username" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Display Name</label>
                <input type="text" class="form-control" name="display_name">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">First Name</label>
                <input type="text" class="form-control" name="first_name">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Last Name</label>
                <input type="text" class="form-control" name="last_name">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Email</label>
                <input type="email" class="form-control" name="email">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Phone</label>
                <input type="text" class="form-control" name="phone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Department</label>
                <input type="text" class="form-control" name="department">
              </div>
              <div class="col-md-12 mb-3">
                <label class="form-label font-weight-bold">Description</label>
                <textarea class="form-control" name="description" rows="2"></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-warning">Update User</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
