{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Lock Single User</h4>
          <p class="card-description">Enter the username you want to lock.</p>
          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="e.g. john.doe" required>
            </div>
            <button type="submit" class="btn btn-dark">Lock User</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
