{% extends "layout.html" %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Bulk Create OUs</h4>
          <p class="card-description">Upload an Excel file to create multiple OUs.</p>
          <small class="text-muted">Expected columns: ou_name, parent_ou, description, protect</small>

          <form method="POST" enctype="multipart/form-data" action="{% url 'create_bulk_ous' %}">
            {% csrf_token %}
            <div class="form-group">
              <label for="excel_file">Excel File (.xlsx)</label>
              <input type="file" class="form-control" id="excel_file" name="excel_file" accept=".xlsx" required>
            </div>
            <div class="mt-3 d-flex gap-2">
  <button type="submit" class="btn btn-primary px-4 mr-2">Create OUs</button>
  <a href="{% static 'samples/bulk_ou_create_sample.xlsx' %}" class="btn btn-outline-primary btn-sm adx-sample-btn mt-3 ml-2" download>
              <i class="mdi mdi-download mr-1"></i> Download Sample Excel
            </a>
</div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
