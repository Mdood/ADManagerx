{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="card adx-card">
        <div class="card-body p-4">

          <h4 class="card-title">Bulk Update OUs</h4>

          <p class="card-description">
            Upload an Excel file to update multiple OUs.
          </p>

          <small class="text-muted d-block mb-3">
            Expected columns: ou_dn, new_name, description, protect
          </small>

          <form method="POST" enctype="multipart/form-data" action="{% url 'update_bulk_ous' %}">
            {% csrf_token %}

            <div class="form-group mb-3">
              <label for="excel_file">Excel File (.xlsx)</label>
              <input type="file"
                     class="form-control"
                     id="excel_file"
                     name="excel_file"
                     accept=".xlsx"
                     required>
            </div>

            <div class="mt-3">
              <button type="submit" class="btn btn-warning px-4 mr-2">
                Update OUs
              </button>

              <a href="{% static 'samples/bulk_ou_update_sample.xlsx' %}" class="btn btn-outline-primary btn-sm adx-sample-btn mt-3 ml-2" download>
              <i class="mdi mdi-download mr-1"></i> Download Sample Excel
            </a>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
