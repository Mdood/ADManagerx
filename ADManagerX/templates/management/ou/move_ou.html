{% extends "layout.html" %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="card adx-card">
        <div class="card-body p-4">

          <h4 class="card-title">Move Organizational Unit</h4>
          <p class="card-description">Move an OU to a different parent OU.</p>

          <form method="post">
            {% csrf_token %}

            <!-- SOURCE OU -->
            <div class="form-group mb-3">
              <label>Select OU to Move</label>

              {% if ous %}
                <select name="ou_dn" class="form-control" required>
                  <option value="">-- Select OU --</option>
                  {% for ou in ous %}
                    <option value="{{ ou.dn }}">
                      {{ ou.ou }} — {{ ou.dn }}
                    </option>
                  {% endfor %}
                </select>
              {% else %}
                <div class="alert alert-warning mb-0">
                  No OUs found (or LDAP issue).
                </div>
              {% endif %}
            </div>

            <!-- TARGET OU -->
            <div class="form-group mb-3">
              <label>Target Parent OU</label>

              {% if ous %}
                <select name="target_parent_dn" class="form-control" required>
                  <option value="">-- Select Target Parent OU --</option>
                  {% for ou in ous %}
                    <option value="{{ ou.dn }}">
                      {{ ou.ou }} — {{ ou.dn }}
                    </option>
                  {% endfor %}
                </select>
              {% endif %}
            </div>

            <!-- ACTION BUTTONS -->
            <div class="mt-4">
              <button type="submit" class="btn btn-primary px-4 mr-2">
                Move OU
              </button>

              <a href="{% url 'ou_management' %}" class="btn btn-light px-4">
                Cancel
              </a>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}
