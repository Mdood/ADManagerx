{% extends "layout.html" %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-5 bg-white">
  <div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card shadow border-0">
        <div class="card-body">
          <h4 class="card-title">Move Organizational Unit</h4>
          <p class="card-description">Move an OU to a different parent OU.</p>

          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label>OU Distinguished Name (DN)</label>
              <input type="text" class="form-control" name="ou_dn" placeholder="OU=HR,DC=corp,DC=local" required>
            </div>
            <div class="form-group">
              <label>Target Parent OU DN</label>
              <input type="text" class="form-control" name="target_parent_dn" placeholder="OU=Departments,DC=corp,DC=local" required>
            </div>
            <button type="submit" class="btn btn-primary">Move OU</button>
            <a href="{% url 'ou_management' %}" class="btn btn-light ml-2">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
