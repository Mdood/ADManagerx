{% extends "layout.html" %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-5 bg-white">
  <div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card shadow border-0">
        <div class="card-body">
          <h4 class="card-title text-danger">Bulk Delete OUs</h4>
          <p class="card-description">Upload an Excel file to delete multiple OUs.</p>
          <small class="text-muted">Expected columns: ou_dn</small>

          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
              <label for="excel_file">Excel File (.xlsx)</label>
              <input type="file" class="form-control" id="excel_file" name="excel_file" accept=".xlsx" required>
            </div>
            <button type="submit" class="btn btn-danger">Delete OUs</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
