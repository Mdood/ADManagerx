{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-5 bg-white">
  <div class="row">
    <div class="col-md-6 offset-md-3 grid-margin stretch-card">
      <div class="card shadow border-0">
        <div class="card-body">
          <h4 class="card-title">Move Single Computer</h4>
          <p class="card-description">Move a computer to a different Organizational Unit (OU)</p>
          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <label for="computer_name">Computer Name</label>
              <input type="text" class="form-control" id="computer_name" name="computer_name" placeholder="Enter computer name">
            </div>
            <div class="form-group">
              <label for="target_ou">Target OU</label>
              <input type="text" class="form-control" id="target_ou" name="target_ou" placeholder="Enter target OU path">
            </div>
            <button type="submit" class="btn btn-primary">Move Computer</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
