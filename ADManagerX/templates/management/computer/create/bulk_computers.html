{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Bulk Computer Creation</h4>
          <p class="card-description">
            Upload an Excel file to create multiple computers at once.
          </p>
          <small class="text-muted">Expected columns: computer_name, ou</small>
<form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
              <label for="excel_file">Upload Excel File (.xlsx)</label>
              <input type="file" name="excel_file" accept=".xlsx" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Upload</button>
            <a href="{% static 'samples/bulk_computer_create_sample.xlsx' %}" class="btn btn-outline-primary btn-sm adx-sample-btn mt-3 ml-2" download>
              <i class="mdi mdi-download mr-1"></i> Download Sample Excel
            </a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
