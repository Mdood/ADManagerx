{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
  <div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Update Single Computer</h4>
          <p class="card-description">Update selected attributes for a computer.</p>

          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label class="form-label font-weight-bold">Computer Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="computer_name" required>
            </div>
            <div class="form-group">
              <label class="form-label font-weight-bold">Description</label>
              <textarea class="form-control" name="description" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-warning">Update Computer</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
