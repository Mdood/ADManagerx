{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
  <div class="row">
    <div class="col-md-8 offset-md-2 grid-margin stretch-card">
      <div class="card adx-card">
        <div class="card-body">
          <h4 class="card-title">Bulk Update Computers</h4>
          <p class="card-description">Upload an Excel file to update multiple computers.</p>
          <small class="text-muted">Expected columns: computer_name, description</small>

          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
              <label for="excelFile">Select Excel File</label>
              <input type="file" name="excel_file" class="form-control" id="excelFile" required>
            </div>
            <button type="submit" class="btn btn-warning">Update Computers</button>
            <a href="{% static 'samples/bulk_computer_update_sample.xlsx' %}" class="btn btn-outline-primary btn-sm adx-sample-btn mt-3 ml-2" download>
              <i class="mdi mdi-download mr-1"></i> Download Sample Excel
            </a>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
