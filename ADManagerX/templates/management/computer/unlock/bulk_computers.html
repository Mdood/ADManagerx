{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="content-wrapper mt-5 pt-4 management-page">
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="card adx-card">
        <div class="card-body p-4">

          <h4 class="card-title">Unlock Bulk Computers</h4>

          <p class="card-description">
            Upload an Excel file with computer names to unlock multiple computer accounts.
          </p>

          <small class="text-muted d-block mb-3">
            Expected columns: computer_name
          </small>

          <form method="POST" action="{% url 'unlock_bulk_computers' %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group mb-3">
              <label for="excel_file">Excel File (.xlsx)</label>
              <input type="file"
                     class="form-control"
                     id="excel_file"
                     name="excel_file"
                     accept=".xlsx"
                     required>
            </div>

            <button type="submit" class="btn btn-success px-4">
              Upload
            </button>
            <a href="{% static 'samples/bulk_computer_unlock_sample.xlsx' %}" class="btn btn-outline-primary btn-sm adx-sample-btn mt-3 ml-2" download>
              <i class="mdi mdi-download mr-1"></i> Download Sample Excel
            </a>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
